name: my_flim
stdev_factor: 0.01
network_type: regular
use_bias: False
use_marker_based_normalization: True
ninput_channels: 3

blocks:
  - name: conv1
    conv_type: standard
    block_type: conv
    inputs: [input]
    kernel_size: [3, 3]
    nkernels_per_marker: 5
    noutput_channels: 12
    dilation_values: [1,1]
    stride: 1
    padding_mode: reflect
    activation: relu
    learnable: true
    learner:
      type: bofp
      clusterer: faiss_kmeans
      kwargs:
        adj_radius: 3
    pooling:
      type: max_pool
      size: [3, 3]
      stride: 2
    
  - name: conv2
    conv_type: standard
    block_type: conv
    inputs: [input]
    kernel_size: [5, 5]
    nkernels_per_marker: 5
    noutput_channels: 12
    dilation_values: [1,1]
    stride: 1
    padding_mode: reflect
    activation: relu
    learnable: true
    learner:
      type: bofp
      clusterer: faiss_kmeans
      kwargs:
        adj_radius: 3
    pooling:
      type: max_pool
      size: [3, 3]
      stride: 2
  
  - name: add1
    block_type: skip_add
    inputs: [conv1, conv2]
    learnable: false
    learner: None

  - name: conv3
    conv_type: standard
    block_type: conv
    inputs: [add1]
    kernel_size: [3, 3]
    nkernels_per_marker: 5
    noutput_channels: 8
    dilation_values: [1,1]
    stride: 1
    padding_mode: reflect
    activation: relu
    learnable: true
    learner:
      type: bofp
      clusterer: faiss_kmeans
      kwargs:
        adj_radius: 3
    pooling:
      type: max_pool
      size: [3, 3]
      stride: 2

decoder:
  type: vanilla_adaptive_decoder
  adaptation_fn: robust_weights
  adj_radius: 1.5
  decoder_layers: [conv1, conv2, conv3]
  combine_strategy: None
